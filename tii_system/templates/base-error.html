<!doctype html>
<html lang="en">

	<head>

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="">
		<meta name="author" content="Monkey D. Fitz, and Bootstrap contributors">

		<title>
			{% block title %}
				{{ page_title|default:"Trade and Investment Approval System" }}
			{% endblock title %}
		</title>

    <!-- Bootstrap core CSS -->
		<link rel="canonical" href="https://getbootstrap.com/docs/4.5/examples/jumbotron/">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

		<style>
			.bd-placeholder-img {
				font-size: 1.125rem;
				text-anchor: middle;
				-webkit-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
				user-select: none;
			}

			@media (min-width: 768px) {
				.bd-placeholder-img-lg {
				font-size: 3.5rem;
				}
			}
		</style>

	</head>

  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark fixed-top" style="background-color: #df0007;">

      <a class="navbar-brand" href="{% url 'dashboards:dashboard'%}">Ut et ligula</a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExampleDefault" aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarsExampleDefault">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'portalpages:home' %}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'portalpages:tracking' %}">Tracking</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'portalpages:help' %}">Help</a>
          </li>
          <li class="nav-item">
            {% if user.is_authenticated %}
              <a class="nav-link" href="{% url 'accounts:logout' %}">Hi {{ user.get_username }} Sign out</a>
            {% else %}
              <a class="nav-link" href="{% url 'accounts:login' %}">Login</a>
            {% endif %}
          </li>
        </ul>
      </div>

    </nav>

    <!-- Main -->
    <main role="main">
    {% block content %}

    {% endblock content %}
    </main>

    <!-- Footer -->
    <footer class="container">
      <p>Copyright &copy; 2022</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>

  </body>
</html>
